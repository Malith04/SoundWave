<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundWave - Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #1DB954;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        .retry-btn {
            background: #1DB954;
            color: black;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .retry-btn:hover {
            background: #1ed760;
            transform: scale(1.05);
        }
        .features {
            margin-top: 40px;
            text-align: left;
        }
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            opacity: 0.7;
        }
        .feature-icon {
            margin-right: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/favicon.svg" alt="SoundWave" class="icon" style="width: 72px; height: 72px; margin: 0 auto 20px; filter: drop-shadow(0 8px 20px rgba(29, 185, 84, 0.4));" />
        <h1>You're Offline</h1>
        <p>SoundWave is currently offline, but you can still enjoy cached music and use basic features.</p>
        
        <button class="retry-btn" onclick="window.location.reload()">
            Try Again
        </button>
        
        <div class="features">
            <div class="feature">
                <span class="feature-icon">🎶</span>
                <span>Play cached music</span>
            </div>
            <div class="feature">
                <span class="feature-icon">❤️</span>
                <span>Browse saved favorites</span>
            </div>
            <div class="feature">
                <span class="feature-icon">📱</span>
                <span>Full PWA experience</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🔄</span>
                <span>Auto-sync when online</span>
            </div>
        </div>
    </div>

    <script>
        // Auto-retry when connection is restored
        window.addEventListener('online', () => {
            setTimeout(() => {
                window.location.reload()
            }, 1000)
        })
        
        // Show connection status
        if (navigator.onLine) {
            document.querySelector('p').textContent = 'Connection restored! Refreshing...'
            setTimeout(() => window.location.reload(), 2000)
        }
    </script>
</body>
</html>
