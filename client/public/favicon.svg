<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="50%" stop-color="#141721" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <!-- Emerald to Electric Cyan Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#1DB954" />
      <stop offset="100%" stop-color="#00f59b" />
    </linearGradient>

    <!-- Secondary Wave Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f59b" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Metallic Border -->
  <rect width="96" height="96" x="2" y="2" rx="26" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Ambient Internal Glow -->
  <circle cx="50" cy="50" r="32" fill="#1DB954" opacity="0.16" filter="url(#glow)" />

  <!-- Stylized Harmonic SoundWave 'S' & Frequency Bars -->
  <g filter="url(#glow)">
    <!-- Harmonic Audio Wave Bars -->
    <!-- Bar 1 (Leftmost) -->
    <rect x="22" y="42" width="6.5" height="16" rx="3.25" fill="url(#waveGrad)" opacity="0.75" />
    
    <!-- Bar 2 (Mid-Left) -->
    <rect x="33" y="30" width="6.5" height="40" rx="3.25" fill="url(#waveGrad)" opacity="0.9" />
    
    <!-- Bar 3 (Center Apex) -->
    <rect x="44" y="19" width="6.5" height="62" rx="3.25" fill="url(#waveGrad)" />
    
    <!-- Bar 4 (Mid-Right) -->
    <rect x="55" y="26" width="6.5" height="48" rx="3.25" fill="url(#cyanGrad)" />
    
    <!-- Bar 5 (Rightmost Peak) -->
    <rect x="66" y="37" width="6.5" height="26" rx="3.25" fill="url(#cyanGrad)" opacity="0.85" />

    <!-- Bar 6 (Trailing Whisper) -->
    <rect x="77" y="44" width="5.5" height="12" rx="2.75" fill="url(#cyanGrad)" opacity="0.6" />

    <!-- Kinetic Sine Wave Arc intersecting the audio bars (representing the continuous acoustic wave) -->
    <path d="M 18 50 C 28 34, 38 66, 50 50 C 62 34, 72 66, 82 50" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-dasharray="1 3"
          opacity="0.45" />

    <!-- Center Energy Pulsar Point -->
    <circle cx="50" cy="50" r="3" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
